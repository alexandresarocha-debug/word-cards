<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#8a6d46"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Words">
<title>Word Cards · A Short Stay in Hell</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f4efe6;font-family:Georgia,serif;color:#222;overflow:hidden}
h1{font-size:1.1rem;color:#8a6d46;letter-spacing:.08em;text-transform:uppercase;margin:0 0 18px}
.stage{perspective:1400px;width:min(92vw,560px);height:min(78vh,460px);position:relative}
.card{position:absolute;inset:0;transition:transform .7s,opacity .5s;transform-style:preserve-3d;cursor:pointer}
.card.hidden{opacity:0;pointer-events:none;transform:translateX(60px)}
.card.flipped .inner{transform:rotateY(180deg)}
.inner{position:absolute;inset:0;transition:transform .7s;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border:3px solid #8a6d46;border-radius:22px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;box-shadow:0 14px 40px rgba(0,0,0,.12)}
.front{align-items:center;text-align:center}
.front .w{font-size:clamp(2.4rem,9vw,4rem);font-weight:bold}.front .p{color:#777;margin-top:8px}
.back{transform:rotateY(180deg);font-size:1rem;line-height:1.45}
.back .m{font-weight:bold;font-size:1.1rem;margin-bottom:14px}.back q{color:#444;display:block;margin-bottom:10px}
.col{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.col span{background:#fbe9b7;border-radius:999px;padding:3px 10px;font-size:.85rem;color:#5a4320}
.src{position:absolute;bottom:14px;right:22px;font-size:.8rem;color:#8a6d46}
.tag{position:absolute;top:14px;left:22px;font-size:.75rem;color:#8a6d46;letter-spacing:.1em}
.nav{margin-top:22px;display:flex;gap:12px;align-items:center}
button{font:inherit;background:#8a6d46;color:#fff;border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
#count{color:#8a6d46;min-width:60px;text-align:center}
</style></head><body>
<h1>A Short Stay in Hell</h1>
<div class="stage" id="stage"></div>
<div class="nav"><button id="prev">‹</button><button id="play">Pause</button><span id="count"></span><button id="shuf">Shuffle</button><button id="next">›</button></div>
<script src="cards.js"></script>
<script>
const C=CARDS;
const st=document.getElementById('stage');let order=C.map((_,i)=>i),i=0,play=true,t;
function build(){st.innerHTML='';order.forEach((k,n)=>{const c=C[k],d=document.createElement('div');d.className='card hidden';
d.innerHTML=`<div class="inner"><div class="face front"><span class="tag">WORD</span><div class="w">${c.word}</div><div class="p">${c.pos}</div><span class="src">tap to flip</span></div>
<div class="face back"><span class="tag">MEANING</span><div class="m">${c.meaning}</div><q>${c.quote}</q><q>${c.example}</q><div class="col">${c.collocations.map(x=>`<span>${x}</span>`).join("")}</div><span class="src">${c.book}${c.page?" · "+c.page:""}</span></div></div>`;
d.onclick=()=>{d.classList.toggle('flipped');reset()};st.appendChild(d)});show()}
function show(){[...st.children].forEach((d,n)=>{d.classList.toggle('hidden',n!==i);if(n!==i)d.classList.remove('flipped')});document.getElementById('count').textContent=`${i+1} / ${C.length}`}
function go(n){i=(i+n+C.length)%C.length;show();reset()}
function tick(){const d=st.children[i];if(!d.classList.contains('flipped'))d.classList.add('flipped');else go(1)}
function reset(){clearInterval(t);if(play)t=setInterval(tick,4000)}
prev.onclick=()=>go(-1);next.onclick=()=>go(1);
document.getElementById('play').onclick=e=>{play=!play;e.target.textContent=play?'Pause':'Play';reset()};
shuf.onclick=()=>{order.sort(()=>Math.random()-.5);i=0;build();reset()};
let x0;st.addEventListener('touchstart',e=>x0=e.touches[0].clientX);st.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)go(dx<0?1:-1)});
document.onkeydown=e=>{if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1);if(e.key==' ')st.children[i].click()};
build();reset();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
